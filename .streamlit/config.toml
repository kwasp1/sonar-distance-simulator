# Forces the dark theme. Without this Streamlit follows the browser's
# light/dark preference, which left its own chrome (widgets, sidebar,
# menus) light while the app's CSS and every Plotly figure stayed dark --
# the mismatch that looked like "dark mode doesn't work".
#
# These values match the palette in app/streamlit_app.py. There is no light
# variant on purpose: the app is dark-only.

[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#070b14"
secondaryBackgroundColor = "#0f172a"
textColor = "#e2e8f0"
font = "sans serif"

[browser]
gatherUsageStats = false
